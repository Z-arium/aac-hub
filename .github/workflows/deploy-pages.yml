name: Deploy site

# Builds the site as static HTML and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://<owner>.github.io/<repo>/.
on:
  push:
    branches: [main]
  # The wiki import commits to main with GITHUB_TOKEN, which doesn't fire push.
  workflow_run:
    workflows: [Wiki import]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # Without this, Pages runs Jekyll and drops the _next folder.
      - run: touch out/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # Keep gh-pages history so each deploy pushes only changed files;
          # the wiki images are hundreds of MB and rarely change.
