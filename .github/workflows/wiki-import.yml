name: Wiki import

# Pulls every article from wiki.aa-classic.com into content/wiki.
# - Weekly and on demand: opens (or updates) a "Wiki refresh" pull request.
# - On a push that changes the importer: commits the fresh import to that branch.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Re-download every page, even unchanged ones
        type: boolean
        default: false
  push:
    paths:
      - scripts/wiki-import/**
      - .github/workflows/wiki-import.yml

permissions:
  contents: write
  pull-requests: write

# A newer push makes an older run's import stale, so cancel it.
concurrency:
  group: wiki-import-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run wiki:import -- ${{ inputs.force && '--force' || '' }}
      - name: Compare site data with the wiki
        run: npm run wiki:check

      - name: Commit to this branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add content/wiki public/wiki-search.json
          if git diff --cached --quiet; then echo "No wiki changes."; exit 0; fi
          git commit -m "Import AAClassic wiki ($(date -u +%F))"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push

      - name: Open refresh pull request
        if: github.event_name != 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: wiki-refresh
          title: Wiki refresh
          commit-message: Refresh AAClassic wiki import
          body: Automated refresh of `content/wiki` from https://wiki.aa-classic.com (CC0).
          add-paths: |
            content/wiki
            public/wiki-search.json
