name: Wiki inventory
on:
  push:
    branches: [claude/project-thread-o8ytb5]
    paths: [scripts/wiki-inventory/inventory.mjs, .github/workflows/wiki-inventory.yml]
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wiki-inventory/inventory.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          mv wiki-inventory.json scripts/wiki-inventory/
          git add scripts/wiki-inventory/wiki-inventory.json
          git commit -m "Wiki inventory"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
