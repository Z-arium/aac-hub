name: Videos
description: Add or remove a Community pick, or hide a video from Recent uploads.
title: Videos
body:
  - type: dropdown
    id: action
    attributes:
      label: What should happen?
      options:
        - Add to Community picks
        - Remove from Community picks
        - Hide from Recent uploads
        - Show again in Recent uploads
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: YouTube links
      description: Paste one or more YouTube links, one per line.
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: true
  - type: input
    id: guide
    attributes:
      label: Guide page (optional)
      description: For a new pick, paste the link of a guide on the site to show the video on that guide too.
      placeholder: https://z-arium.github.io/aac-hub/guides/gearing-path
  - type: textarea
    id: blurb
    attributes:
      label: Why it's worth watching (optional)
      description: One or two sentences shown under a new pick.
